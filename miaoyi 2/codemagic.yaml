workflows:
  android-apk:
    name: Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      vars:
        API_BASE_URL: https://api.example.com   # set your deployed backend URL
    scripts:
      - name: Generate platform files
        script: cd mobile && flutter create . --project-name miaoyi --platforms=android
      - name: Get packages
        script: cd mobile && flutter pub get
      - name: Analyze
        script: cd mobile && flutter analyze
      - name: Build APK
        script: cd mobile && flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - mobile/build/app/outputs/flutter-apk/*.apk
